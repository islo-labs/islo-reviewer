[job]
name = "islo-review"
version = "0.1.0"
description = "Run the islo-reviewer PR review action as a durable Islo job."

[job.params.repo]
type = "string"
required = true
description = "GitHub repository in owner/name form."
pattern = "^[^/]+/[^/]+$"

[job.params.pr_number]
type = "integer"
required = true
description = "Pull request number to review."

[job.params.sandbox_name]
type = "string"
required = true
description = "Stable PR-scoped sandbox name to reuse across review runs."
pattern = "^islo-review-[a-f0-9]{12}-[0-9]+$"

[job.params.reviewer_ref]
type = "string"
required = true
description = "islo-reviewer git ref to run, usually the action ref such as v1."

[job.params.model]
type = "string"
default = "claude-opus-4-6"
description = "Claude model for the review agent."

[job.params.max_turns]
type = "integer"
default = 50
description = "Maximum agentic turns."

[job.params.max_budget_usd]
type = "number"
default = 10
description = "Maximum review budget in USD."

[run]
fail_fast = true
fanout = false
timeout = 900
workdir = "/workspace"
teardown_on_complete = false

[run.sandbox]
mode = "ensure"
name = "{{sandbox_name}}"
image = "islo/default"
snapshot_name = "islo-stack"
vcpus = 4
memory_mb = 4096
gateway_profile = "default"
init = { type = "minimal" }

[run.sandbox.lifecycle]
pause_after = 1800
delete_after = 604800

[[run.tasks]]
name = "review"

[[run.tasks.steps]]
name = "run-reviewer"
timeout = 900
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
cd /workspace
rm -rf islo-reviewer
git clone https://github.com/islo-labs/islo-reviewer.git
cd islo-reviewer
git fetch --depth=1 origin "{{reviewer_ref}}"
git -c advice.detachedHead=false checkout FETCH_HEAD
npm ci
npx tsx src/review.ts "{{repo}}" "{{pr_number}}" "{{model}}" "{{max_turns}}" "{{max_budget_usd}}"
''',
]

[[run.tasks.steps]]
name = "pause-review-sandbox"
pause = true
