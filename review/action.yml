name: 'Islo PR Review'
description: 'Automated PR review powered by Islo jobs and Claude'

inputs:
  pr_number:
    description: 'PR number to review'
    required: true
  islo_config:
    description: 'Deprecated for jobs. Configure sandbox setup in the deployed islo-review job.'
    required: false
    default: ''
  snapshot:
    description: 'Deprecated for jobs. Configure snapshot_name in the deployed islo-review job.'
    required: false
    default: ''
  cpu:
    description: 'Deprecated for jobs. Configure vcpus in the deployed islo-review job.'
    required: false
    default: '4'
  memory:
    description: 'Deprecated for jobs. Configure memory_mb in the deployed islo-review job.'
    required: false
    default: '4096'
  model:
    description: 'Claude model to use (e.g., claude-opus-4-6, claude-sonnet-4)'
    required: false
    default: 'claude-opus-4-6'
  max_turns:
    description: 'Maximum agentic turns (tool-use round trips)'
    required: false
    default: '50'
  max_budget_usd:
    description: 'Stop when cost estimate reaches this USD value'
    required: false
    default: '10'

runs:
  using: 'composite'
  steps:
    - name: Install islo CLI
      shell: bash
      run: curl -fsSL https://islo.dev/install.sh | sh

    - name: Validate review job
      shell: bash
      run: |
        set -euo pipefail
        JOB_JSON="$(islo job -o json get islo-review)"
        printf '%s' "${JOB_JSON}" | node "${GITHUB_ACTION_PATH}/validate-job.mjs"

    - name: Review
      shell: bash
      env:
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr_number }}
        REVIEWER_REF: ${{ github.action_ref || 'v1' }}
        MODEL: ${{ inputs.model }}
        MAX_TURNS: ${{ inputs.max_turns }}
        MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}
      run: |
        set -euo pipefail
        islo job run islo-review --watch \
          --param repo="${REPO}" \
          --param pr_number="${PR_NUMBER}" \
          --param reviewer_ref="${REVIEWER_REF}" \
          --param model="${MODEL}" \
          --param max_turns="${MAX_TURNS}" \
          --param max_budget_usd="${MAX_BUDGET_USD}"
